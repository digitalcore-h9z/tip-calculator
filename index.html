<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
            rel="stylesheet"
        />

        <title>Tip Calculator</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <script src="/main.js"></script>
        <div class="card-container">
            <div class="card-wrapper">
                <div class="card">
                    <h3>Calculator de bacsis</h3>
                    <label for="price">Pretul mesei: </label>
                    <input type="number" required id="price" placeholder="Introdu pretul mesei..." />

                    <label for="tip">Bacsis: </label>
                    <input type="number" required id="tip" placeholder="Introdu bacsisul dorit (ex: 10%)..." />

                    <p id="priceTip">Pret Bacsis:</p>
                    <p id="total-p">Total:</p>

                    <div class="btns">
                        <button class="reset-btn" onclick="reset()">Reset</button>
                        <button class="calculate-btn" onclick="calculation()">Calculate</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
